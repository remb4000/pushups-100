<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PushupOS: Путь Воина</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PushupOS">
    
    <!-- Icons & Manifest -->
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/0f172a/06b6d4?text=PushupOS">
    <link rel="icon" type="image/jpeg" href="https://placehold.co/192x192/0f172a/06b6d4?text=PushupOS">
    
    <script>
        const manifest = {
            name: "PushupOS",
            short_name: "PushupOS",
            display: "standalone",
            background_color: "#0f172a",
            theme_color: "#0f172a",
            icons: [{
                src: "https://placehold.co/512x512/0f172a/06b6d4?text=PushupOS",
                sizes: "512x512",
                type: "image/png"
            }]
        };
        const manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: "application/json"}));
        document.write("<link rel=\"manifest\" href=\"" + manifestUrl + "\">");
    </script>

    <!-- React, Babel, Tailwind, Tone.js, FontAwesome -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        neon: { blue: "#06b6d4", purple: "#a855f7", pink: "#ec4899", green: "#10b981" }, 
                        dark: { bg: "#0f172a", panel: "#1e293b" } 
                    },
                    boxShadow: { 
                        "neon-blue": "0 0 10px rgba(6, 182, 212, 0.5), 0 0 20px rgba(6, 182, 212, 0.3)", 
                        "neon-green": "0 0 10px rgba(16, 185, 129, 0.5), 0 0 20px rgba(16, 185, 129, 0.3)", 
                        "neon-purple": "0 0 10px rgba(168, 85, 247, 0.5), 0 0 20px rgba(168, 85, 247, 0.3)" 
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            overflow-x: hidden; 
        }
        ::-webkit-scrollbar { display: none; }
        .safe-area-pt { padding-top: env(safe-area-inset-top, 20px); }
        .safe-area-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        .glass-panel { 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        
        .nav-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .neon-text-glow { text-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
        .timer-circle { transition: stroke-dashoffset 1s linear; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const initFirebase = async () => {
            const appId = typeof __app_id !== "undefined" ? __app_id : "pushups-app-default";
            const fbConfig = typeof __firebase_config !== "undefined" ? JSON.parse(__firebase_config) : null;
            const initialAuthToken = typeof __initial_auth_token !== "undefined" ? __initial_auth_token : null;
            let auth, db, user;
            try {
                if (fbConfig) {
                    const app = initializeApp(fbConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    if (initialAuthToken) { await signInWithCustomToken(auth, initialAuthToken); } else { await signInAnonymously(auth); }
                    user = auth.currentUser;
                }
            } catch (e) { console.warn("Firebase initialization skipped or failed:", e); }
            window.firebaseEnv = { db, user, appId, doc, getDoc, setDoc };
            window.dispatchEvent(new Event("firebaseReady"));
        };
        initFirebase();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        
        // План тренировок
        const WORKOUT_PLAN = {
            1: { 1: { 1: [12, 10, 8, 8, 6], 2: [12, 12, 10, 8, 8], 3: [15, 12, 10, 10, 8] },
                 2: { 1: [16, 14, 12, 10, 10], 2: [18, 15, 12, 12, 10], 3: [20, 16, 14, 12, 10] },
                 3: { 1: [22, 18, 15, 12, 12], 2: [25, 20, 15, 15, 12], 3: [30, 22, 18, 15, 15] } },
            2: { 1: { 1: [20, 20, 20, 20, 20, 20], 2: [15, 15, 15, 15], 3: [40, 15, 15, 15] } }
        };

        const WARMUP_EXERCISES = [
            { title: "Вращения плечами", time: 60, desc: "Встаньте прямо. Плавно вращайте плечами назад 10 раз, затем вперед 10 раз. Сделайте 15 широких махов прямыми руками.", icon: "fa-child-reaching" },
            { title: "Разогрев локтей", time: 30, desc: "Разведите руки в стороны (буква Т). Вращайте предплечьями внутрь 15 раз, затем наружу 15 раз. Держите плечи неподвижно.", icon: "fa-arrows-spin" },
            { title: "Растяжка кистей", time: 60, desc: "Встаньте на четвереньки. Плавно покачивайтесь вперед-назад. Переверните кисти пальцами к себе и потянитесь назад.", icon: "fa-hand" },
            { title: "Лопаточные отж.", time: 45, desc: "Примите упор лежа. Не сгибая локти, провалитесь в лопатках вниз, затем с силой вытолкните спину вверх. 15 раз.", icon: "fa-dumbbell" }
        ];

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null, errorInfo: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error(error, errorInfo); this.setState({ errorInfo }); }
            render() {
                if (this.state.hasError) return (
                    <div className="min-h-screen bg-slate-950 text-red-400 p-6 flex flex-col items-center justify-center">
                        <h2>Системный сбой</h2>
                        <button onClick={() => window.location.reload()} className="bg-red-900 border border-red-500 text-white px-6 py-2 mt-4 rounded-xl">Перезагрузить</button>
                    </div>
                );
                return this.props.children;
            }
        }

        // --- MAIN APP ---
        const App = () => {
            const [isReady, setIsReady] = useState(false);
            const [activeTab, setActiveTab] = useState("dashboard");
            
            // User Data State
            const [userData, setUserData] = useState({ 
                level: 1, xp: 0, currentStage: 1, currentWeek: 1, currentDay: 1, 
                completedSets: [], preWorkoutDone: { breath: false, citrulline: false },
                history: []
            });
            
            // Rest Timer
            const [isResting, setIsResting] = useState(false);
            const [restTime, setRestTime] = useState(0);
            
            // Warmup Wizard
            const [warmupState, setWarmupState] = useState('idle');
            const [warmupIndex, setWarmupIndex] = useState(0);
            const [warmupTimeLeft, setWarmupTimeLeft] = useState(0);

            // Active Workout Set
            const [currentSetReps, setCurrentSetReps] = useState(0);

            // Audio & Wake Lock
            const [soundEnabled, setSoundEnabled] = useState(true);
            const toneStarted = useRef(false);
            const wakeLock = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const requestWakeLock = async () => {
                    try {
                        if ('wakeLock' in navigator) {
                            wakeLock.current = await navigator.wakeLock.request('screen');
                            console.log('Wake Lock acquired successfully.');
                        }
                    } catch (err) {
                        console.warn(`Wake Lock error: ${err.name}, ${err.message}`);
                    }
                };

                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') requestWakeLock();
                };

                requestWakeLock();
                document.addEventListener('visibilitychange', handleVisibilityChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    if (wakeLock.current !== null) {
                        wakeLock.current.release().catch(console.error);
                        wakeLock.current = null;
                    }
                };
            }, []);

            useEffect(() => {
                let isMounted = true;
                const loadData = async () => {
                    // Local Storage is priority
                    const localData = localStorage.getItem("pushups_data_backup");
                    if (localData) {
                        try {
                            const parsed = JSON.parse(localData);
                            if (isMounted) {
                                setUserData(prev => ({ ...prev, ...parsed }));
                                setIsReady(true);
                                return;
                            }
                        } catch(e) { console.warn("Failed to parse local data", e); }
                    }

                    // Fallback to Firebase if local doesn't exist
                    const env = window.firebaseEnv;
                    if (env && env.user && env.db && env.getDoc && env.doc) {
                        try {
                            const docRef = env.doc(env.db, "artifacts", env.appId, "users", env.user.uid, "pushupsData", "main");
                            const docSnap = await env.getDoc(docRef);
                            if (docSnap.exists() && isMounted) { setUserData(prev => ({ ...prev, ...docSnap.data() })); }
                        } catch (err) {}
                    }
                    if (isMounted) setIsReady(true);
                };
                
                if (window.firebaseEnv && window.firebaseEnv.getDoc) { 
                    loadData(); 
                } else {
                    const localData = localStorage.getItem("pushups_data_backup");
                    if (localData) {
                        try {
                            setUserData(prev => ({ ...prev, ...JSON.parse(localData) }));
                            setIsReady(true);
                        } catch(e) {}
                    }
                    const handler = () => loadData();
                    window.addEventListener("firebaseReady", handler);
                    const timeoutId = setTimeout(() => { if (isMounted && !isReady) setIsReady(true); }, 3000);
                    return () => { window.removeEventListener("firebaseReady", handler); clearTimeout(timeoutId); isMounted = false; };
                }
                return () => { isMounted = false; };
            }, []);

            const saveUserData = async (newData) => {
                try {
                    localStorage.setItem("pushups_data_backup", JSON.stringify(newData));
                } catch (e) {
                    console.warn("Failed to save to localStorage", e);
                }

                const env = window.firebaseEnv;
                if (!env || !env.user || !env.db || !env.setDoc) return; 
                try {
                    const docRef = env.doc(env.db, "artifacts", env.appId, "users", env.user.uid, "pushupsData", "main");
                    await env.setDoc(docRef, newData, { merge: true });
                } catch (err) {}
            };

            const handleExport = () => {
                playSound("click");
                const dataStr = JSON.stringify(userData);
                const dataUri = "data:application/json;charset=utf-8," + encodeURIComponent(dataStr);
                const exportFileDefaultName = `pushups_backup_${new Date().toISOString().split('T')[0]}.json`;
                
                const linkElement = document.createElement("a");
                linkElement.setAttribute("href", dataUri);
                linkElement.setAttribute("download", exportFileDefaultName);
                linkElement.click();
            };

            const handleImportClick = () => {
                playSound("click");
                fileInputRef.current?.click();
            };

            const handleFileChange = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (importedData && importedData.level !== undefined) {
                            setUserData(importedData);
                            saveUserData(importedData);
                            alert("Данные успешно импортированы! Прогресс восстановлен.");
                        } else {
                            alert("Неверный формат файла резервной копии.");
                        }
                    } catch (error) {
                        alert("Ошибка при чтении файла.");
                    }
                };
                reader.readAsText(file);
                event.target.value = null;
            };

            useEffect(() => {
                let interval = null;
                if (isResting && restTime > 0) { 
                    interval = setInterval(() => { setRestTime(t => t - 1); }, 1000); 
                } else if (restTime <= 0 && isResting) { 
                    setIsResting(false); 
                    playSound("timer"); 
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]); 
                }
                return () => { if (interval) clearInterval(interval); };
            }, [isResting, restTime]);

            useEffect(() => {
                let interval = null;
                if (activeTab === 'warmup' && warmupState === 'running' && warmupTimeLeft > 0) {
                    interval = setInterval(() => setWarmupTimeLeft(t => t - 1), 1000);
                } else if (activeTab === 'warmup' && warmupState === 'running' && warmupTimeLeft === 0) {
                    playSound("timer");
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    
                    if (warmupIndex < WARMUP_EXERCISES.length - 1) {
                        setWarmupIndex(i => i + 1);
                        setWarmupTimeLeft(WARMUP_EXERCISES[warmupIndex + 1].time);
                    } else {
                        setWarmupState('finished');
                        playSound("levelUp");
                    }
                }
                return () => { if (interval) clearInterval(interval); };
            }, [activeTab, warmupState, warmupTimeLeft, warmupIndex]);

            const playSound = async (type) => {
                if (!soundEnabled) return;
                try {
                    if (!toneStarted.current || Tone.context.state !== "running") { await Tone.start(); toneStarted.current = true; }
                    if (type === "click") { const synth = new Tone.Synth().toDestination(); synth.triggerAttackRelease("C6", "32n"); } 
                    else if (type === "set") { const synth = new Tone.PolySynth(Tone.Synth).toDestination(); synth.triggerAttackRelease(["C5", "E5", "G5"], "8n", Tone.now()); } 
                    else if (type === "timer") { const synth = new Tone.Synth({ oscillator: { type: "triangle" } }).toDestination(); const now = Tone.now(); synth.triggerAttackRelease("C4", "8n", now); synth.triggerAttackRelease("E4", "8n", now + 0.2); synth.triggerAttackRelease("G4", "8n", now + 0.4); synth.triggerAttackRelease("C5", "2n", now + 0.6); } 
                    else if (type === "levelUp") { const synth = new Tone.PolySynth(Tone.Synth).toDestination(); const now = Tone.now(); synth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now); synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "2n", now + 0.6); }
                } catch (e) {}
            };

            const togglePreWorkout = (type) => {
                playSound("click");
                const newPre = { ...userData.preWorkoutDone, [type]: !userData.preWorkoutDone[type] };
                const newData = { ...userData, preWorkoutDone: newPre };
                setUserData(newData); saveUserData(newData);
            };

            const completeSet = (index) => {
                if (userData.completedSets.includes(index)) return; 
                playSound("set");
                const currentPlan = WORKOUT_PLAN[userData.currentStage]?.[userData.currentWeek]?.[userData.currentDay] || [];
                const newCompleted = [...userData.completedSets, index];
                
                let newXp = userData.xp + 10;
                let newLevel = userData.level;
                if (newXp >= newLevel * 50) {
                    newLevel++;
                    playSound("levelUp");
                }

                let newData = { ...userData, completedSets: newCompleted, xp: newXp, level: newLevel };
                
                if (newCompleted.length === currentPlan.length) { 
                    playSound("levelUp"); 
                } else { 
                    setRestTime(90); 
                    setIsResting(true); 
                }
                
                setUserData(newData); saveUserData(newData);
                setCurrentSetReps(0);
            };

            const incrementReps = (targetReps, setIndex) => {
                playSound("click");
                if (currentSetReps + 1 >= targetReps) {
                    completeSet(setIndex);
                } else {
                    setCurrentSetReps(prev => prev + 1);
                }
            };

            const getRankName = (level) => {
                if (level >= 30) return "Кибер-машина 🦾";
                if (level >= 20) return "Терминатор 🤖";
                if (level >= 12) return "Кибер-Атлет ⚡";
                if (level >= 7) return "Атлет 🏋️";
                if (level >= 3) return "Котлет 🥩";
                return "Пельмень 🥟";
            };

            const completeDay = () => {
                let { currentStage, currentWeek, currentDay, history } = userData;
                
                const currentPlan = WORKOUT_PLAN[currentStage]?.[currentWeek]?.[currentDay] || [];
                const totalReps = currentPlan.reduce((a, b) => a + b, 0);

                const newHistoryEntry = {
                    id: Date.now(),
                    date: new Date().toISOString(),
                    stage: currentStage,
                    week: currentWeek,
                    day: currentDay,
                    totalReps: totalReps
                };

                const newHistory = [newHistoryEntry, ...(history || [])];
                const daysInWeek = Object.keys(WORKOUT_PLAN[currentStage]?.[currentWeek] || {}).length;

                currentDay++;
                
                if (currentDay > (daysInWeek || 3)) {
                    currentDay = 1;
                    currentWeek++;
                    const weeksInStage = Object.keys(WORKOUT_PLAN[currentStage] || {}).length;
                    
                    if (currentWeek > (weeksInStage || 1)) {
                        currentWeek = 1;
                        currentStage++;
                        if (!WORKOUT_PLAN[currentStage]) currentStage = 1; 
                    }
                }

                const newData = {
                    ...userData,
                    currentStage,
                    currentWeek,
                    currentDay,
                    completedSets: [],
                    preWorkoutDone: { breath: false, citrulline: false },
                    history: newHistory
                };
                
                setUserData(newData);
                saveUserData(newData);
                setActiveTab('dashboard');
                playSound('levelUp');
            };

            const Dashboard = () => (
                <div className="space-y-6 pb-28 animate-[fadeIn_0.3s_ease-out]">
                    <div className="glass-panel rounded-2xl p-6 mt-4 shadow-neon-blue relative overflow-hidden">
                        <div className="text-neon-blue mb-1 text-sm font-bold tracking-widest uppercase">Уровень {userData.level}</div>
                        <h1 className="text-3xl font-black text-white mb-4 neon-text-glow">{getRankName(userData.level)}</h1>
                        
                        <div className="w-full bg-slate-800 rounded-full h-3 mb-2">
                            <div className="bg-gradient-to-r from-neon-blue to-neon-purple h-3 rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(6,182,212,0.5)]" 
                                 style={{width: `${(userData.xp % (userData.level * 50)) / (userData.level * 50) * 100}%`}}></div>
                        </div>
                        <p className="text-xs text-right text-gray-400">{userData.xp % (userData.level * 50)} / {userData.level * 50} XP</p>
                        
                        <div className="text-gray-400 mt-4 text-sm flex justify-between border-t border-slate-700/50 pt-4">
                            <span className="font-bold text-white">Этап {userData.currentStage}</span>
                            <span>Неделя {userData.currentWeek}</span>
                            <span>День {userData.currentDay}</span>
                        </div>
                    </div>

                    <div className="glass-panel rounded-2xl p-5 shadow-[0_4px_10px_rgba(0,0,0,0.3)]">
                        <h3 className="text-lg font-bold mb-4 flex items-center text-white"><i className="fa-solid fa-bolt text-yellow-400 mr-2"></i> Чек-лист перед боем</h3>
                        <div className="space-y-3">
                            <button onClick={() => togglePreWorkout("breath")} className={`w-full flex items-center justify-between p-4 rounded-xl border transition-all ${userData.preWorkoutDone.breath ? "bg-neon-green/20 border-neon-green text-white shadow-[0_0_10px_rgba(16,185,129,0.3)]" : "bg-slate-800 border-slate-700 text-gray-400"}`}>Дыхание Вима Хофа {userData.preWorkoutDone.breath && <i className="fa-solid fa-check text-neon-green"></i>}</button>
                            <button onClick={() => togglePreWorkout("citrulline")} className={`w-full flex items-center justify-between p-4 rounded-xl border transition-all ${userData.preWorkoutDone.citrulline ? "bg-neon-green/20 border-neon-green text-white shadow-[0_0_10px_rgba(16,185,129,0.3)]" : "bg-slate-800 border-slate-700 text-gray-400"}`}>Цитруллин малат (8г) {userData.preWorkoutDone.citrulline && <i className="fa-solid fa-check text-neon-green"></i>}</button>
                        </div>
                        <button onClick={() => { setActiveTab("warmup"); playSound("click"); }} className="w-full mt-6 bg-gradient-to-r from-neon-blue to-blue-600 hover:from-blue-500 hover:to-blue-700 text-white font-bold py-4 rounded-xl active:scale-95 transition-transform shadow-neon-blue">Начать подготовку <i className="fa-solid fa-arrow-right ml-2"></i></button>
                    </div>

                    <div className="glass-panel rounded-2xl p-5 shadow-[0_4px_10px_rgba(0,0,0,0.3)]">
                        <h3 className="text-lg font-bold mb-4 flex items-center text-white">
                            <i className="fa-solid fa-cloud-arrow-up text-blue-400 mr-2"></i> Данные
                        </h3>
                        <p className="text-xs text-gray-400 mb-4">Данные хранятся локально на устройстве. Экспортируйте прогресс перед сменой телефона.</p>
                        <div className="flex space-x-3">
                            <button onClick={handleExport} className="flex-1 bg-slate-800 border border-slate-700 hover:border-neon-blue text-white py-3 rounded-xl transition-colors flex justify-center items-center shadow-md">
                                <i className="fa-solid fa-download mr-2"></i> Экспорт
                            </button>
                            <button onClick={handleImportClick} className="flex-1 bg-slate-800 border border-slate-700 hover:border-neon-purple text-white py-3 rounded-xl transition-colors flex justify-center items-center shadow-md">
                                <i className="fa-solid fa-upload mr-2"></i> Импорт
                            </button>
                            <input type="file" ref={fileInputRef} onChange={handleFileChange} accept=".json" className="hidden" />
                        </div>
                    </div>

                    <div className="glass-panel rounded-2xl p-5 shadow-[0_4px_10px_rgba(0,0,0,0.3)]">
                        <h3 className="text-lg font-bold mb-4 flex items-center text-white"><i className="fa-solid fa-scroll text-neon-purple mr-2"></i> История подвигов</h3>
                        {(!userData.history || userData.history.length === 0) ? (
                            <div className="text-center py-6">
                                <i className="fa-solid fa-ghost text-4xl text-slate-700 mb-3"></i>
                                <p className="text-gray-500 text-sm">Ты еще не совершал подвигов.<br/>Пора начинать!</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {userData.history.map(entry => (
                                    <div key={entry.id} className="flex items-center justify-between border-b border-slate-700/50 pb-3 last:border-0 last:pb-0">
                                        <div>
                                            <div className="text-white font-bold text-sm">Этап {entry.stage} • Неделя {entry.week} • День {entry.day}</div>
                                            <div className="text-gray-500 text-xs mt-1 capitalize">
                                                {new Date(entry.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}
                                            </div>
                                        </div>
                                        <div className="bg-slate-800/80 rounded-lg px-3 py-1.5 flex items-center border border-slate-700 shadow-inner">
                                            <span className="text-neon-blue font-black mr-2 text-lg">{entry.totalReps}</span>
                                            <i className="fa-solid fa-dumbbell text-slate-500"></i>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );

            const Warmup = () => {
                const currentEx = WARMUP_EXERCISES[warmupIndex];
                
                const startWarmup = () => {
                    playSound("click");
                    setWarmupIndex(0);
                    setWarmupTimeLeft(WARMUP_EXERCISES[0].time);
                    setWarmupState('running');
                };

                const skipCurrent = () => {
                    playSound("click");
                    if (warmupIndex < WARMUP_EXERCISES.length - 1) {
                        setWarmupIndex(i => i + 1);
                        setWarmupTimeLeft(WARMUP_EXERCISES[warmupIndex + 1].time);
                    } else {
                        setWarmupState('finished');
                        playSound("levelUp");
                    }
                };

                if (warmupState === 'idle') {
                    return (
                        <div className="space-y-4 pb-28 mt-4 animate-[fadeIn_0.3s_ease-out]">
                            <h2 className="text-2xl font-bold text-center mb-6 neon-text-glow text-white">Суставная разминка</h2>
                            {WARMUP_EXERCISES.map((w, i) => (
                                <div key={i} className="glass-panel p-4 rounded-xl flex items-start space-x-4 opacity-80 border-slate-700/50">
                                    <div className="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center text-neon-blue flex-shrink-0 shadow-neon-blue"><i className={`fa-solid ${w.icon} text-xl`}></i></div>
                                    <div>
                                        <h4 className="font-bold text-white flex items-center justify-between w-full gap-2">
                                            {w.title} <span className="text-neon-purple text-xs bg-neon-purple/10 px-2 py-1 rounded-md">{w.time} сек</span>
                                        </h4>
                                    </div>
                                </div>
                            ))}
                            <button onClick={startWarmup} className="w-full mt-8 bg-gradient-to-r from-neon-purple to-purple-600 hover:from-purple-500 hover:to-purple-700 text-white font-bold py-4 rounded-xl text-lg shadow-[0_0_15px_rgba(168,85,247,0.5)] active:scale-95 transition-transform">
                                Начать разминку <i className="fa-solid fa-play ml-2"></i>
                            </button>
                        </div>
                    );
                }

                if (warmupState === 'finished') {
                    return (
                        <div className="flex flex-col items-center justify-center h-[60vh] text-center animate-[fadeIn_0.5s_ease-out]">
                            <div className="w-24 h-24 bg-neon-green/20 rounded-full flex items-center justify-center mb-6 shadow-neon-green border border-neon-green/30">
                                <i className="fa-solid fa-check text-5xl text-neon-green"></i>
                            </div>
                            <h2 className="text-3xl font-bold text-white mb-4">Разминка завершена!</h2>
                            <p className="text-gray-400 mb-8">Тело разогрето, суставы готовы к бою.</p>
                            <button 
                                onClick={() => { setActiveTab("workout"); playSound("click"); setWarmupState('idle'); }} 
                                className="w-full max-w-xs bg-gradient-to-r from-neon-blue to-blue-600 text-white font-bold py-4 rounded-xl shadow-neon-blue text-lg active:scale-95 transition-transform">
                                К тренировке! <i className="fa-solid fa-fire ml-2"></i>
                            </button>
                        </div>
                    );
                }

                // Running or Paused
                const radius = 90; 
                const circumference = 2 * Math.PI * radius; 
                const totalTime = WARMUP_EXERCISES[warmupIndex].time;
                const strokeDashoffset = circumference - (warmupTimeLeft / totalTime) * circumference;

                return (
                    <div className="flex flex-col items-center justify-start mt-4 pb-28 h-full animate-[fadeIn_0.3s_ease-out]">
                        <div className="w-full flex justify-between items-center mb-6 px-4">
                            <span className="text-neon-purple font-bold tracking-widest text-sm uppercase">ШАГ {warmupIndex + 1}/{WARMUP_EXERCISES.length}</span>
                            <button onClick={() => setWarmupState('idle')} className="text-gray-500 text-sm hover:text-white bg-slate-800 px-3 py-1 rounded-lg border border-slate-700 transition-colors"><i className="fa-solid fa-xmark"></i> Закрыть</button>
                        </div>

                        <h2 className="text-2xl font-bold text-center mb-2 text-white px-2">{currentEx.title}</h2>
                        <p className="text-gray-400 text-center mb-8 px-6 text-sm min-h-[60px]">{currentEx.desc}</p>

                        <div className="relative w-64 h-64 flex items-center justify-center mb-10">
                            <svg className="transform -rotate-90 w-64 h-64 absolute">
                                <circle cx="128" cy="128" r={radius} stroke="#1e293b" strokeWidth="8" fill="none" />
                                <circle 
                                    cx="128" cy="128" r={radius} 
                                    stroke="#a855f7" strokeWidth="12" fill="none" 
                                    strokeDasharray={circumference} 
                                    strokeDashoffset={strokeDashoffset} 
                                    className="timer-circle drop-shadow-[0_0_15px_rgba(168,85,247,0.4)]"
                                    strokeLinecap="round"
                                />
                            </svg>
                            <div className="absolute flex flex-col items-center">
                                <i className={`fa-solid ${currentEx.icon} text-3xl text-neon-purple/50 mb-2`}></i>
                                <span className="text-6xl font-black text-white">{warmupTimeLeft}</span>
                            </div>
                        </div>

                        <div className="flex space-x-4 w-full px-6 max-w-sm">
                            <button 
                                onClick={() => { playSound("click"); setWarmupState(prev => prev === 'running' ? 'paused' : 'running'); }} 
                                className="flex-1 py-4 rounded-xl border border-neon-purple/50 text-white font-bold glass-panel active:bg-neon-purple/20 transition-all flex items-center justify-center">
                                <i className={`fa-solid ${warmupState === 'running' ? 'fa-pause' : 'fa-play'} mr-2`}></i>
                                {warmupState === 'running' ? 'Пауза' : 'Продолжить'}
                            </button>
                            <button onClick={skipCurrent} className="px-6 py-4 rounded-xl bg-slate-800 text-gray-400 border border-slate-700 active:bg-slate-700 transition-colors">
                                <i className="fa-solid fa-forward-step"></i>
                            </button>
                        </div>
                    </div>
                );
            };

            const Workout = () => {
                const planRef = WORKOUT_PLAN[userData.currentStage]?.[userData.currentWeek]?.[userData.currentDay];
                const currentPlan = planRef || [10, 10, 10]; 
                const isAllDone = userData.completedSets.length === currentPlan.length;

                if (isAllDone) {
                    return (
                        <div className="flex flex-col items-center justify-center h-[60vh] text-center animate-[fadeIn_0.5s_ease-out]">
                            <i className="fa-solid fa-trophy text-6xl text-yellow-400 mb-6 drop-shadow-[0_0_20px_rgba(250,204,21,0.6)]"></i>
                            <h2 className="text-2xl font-bold text-white mb-2">Тренировка завершена!</h2>
                            <p className="text-gray-400 mb-8">Ты стал на шаг ближе к 100 отжиманиям.</p>
                            <button 
                                onClick={completeDay}
                                className="w-full max-w-xs bg-gradient-to-r from-neon-blue to-blue-600 hover:from-blue-500 hover:to-blue-700 text-white font-bold py-4 rounded-xl shadow-neon-blue transition-all active:scale-95 text-lg"
                            >
                                Забрать награду <i className="fa-solid fa-star ml-2"></i>
                            </button>
                        </div>
                    );
                }

                return (
                    <div className="pb-28 mt-4 flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
                        <h2 className="text-2xl font-bold text-center mb-2 neon-text-glow text-white">Тренировка {userData.currentDay}</h2>
                        <div className="w-full max-w-sm space-y-4 mt-6">
                            {currentPlan.map((reps, index) => {
                                const isDone = userData.completedSets.includes(index);
                                const isNext = userData.completedSets.length === index;
                                
                                if (isNext) {
                                    return (
                                        <div key={index} className="w-full p-5 rounded-2xl bg-slate-800/80 border border-neon-blue shadow-[0_0_15px_rgba(6,182,212,0.3)] transform transition-all animate-[fadeIn_0.3s_ease-out]">
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="text-neon-blue font-bold">Подход {index + 1}</span>
                                                <span className="text-gray-400 text-sm">Цель: {reps}</span>
                                            </div>
                                            <div className="flex items-stretch justify-between gap-3 h-24">
                                                <button 
                                                    onClick={() => incrementReps(reps, index)}
                                                    className="flex-1 bg-gradient-to-br from-neon-blue to-blue-700 hover:from-blue-400 hover:to-blue-600 text-white rounded-xl flex flex-col items-center justify-center active:scale-95 transition-transform shadow-neon-blue"
                                                >
                                                    <span className="text-4xl font-black leading-none mb-1">{currentSetReps} <span className="text-xl text-blue-200 opacity-70">/ {reps}</span></span>
                                                    <span className="text-[10px] font-bold opacity-80 uppercase tracking-widest mt-1"><i className="fa-solid fa-plus"></i> Одно</span>
                                                </button>
                                                <button 
                                                    onClick={() => completeSet(index)}
                                                    className="w-16 flex flex-col items-center justify-center bg-slate-700/50 hover:bg-neon-green/20 border border-slate-600 hover:border-neon-green rounded-xl text-gray-400 hover:text-neon-green active:scale-95 transition-all"
                                                    title="Завершить подход полностью"
                                                >
                                                    <i className="fa-solid fa-check-double text-xl mb-1"></i>
                                                    <span className="text-[10px] font-bold">ВСЕ</span>
                                                </button>
                                            </div>
                                        </div>
                                    );
                                }

                                return (
                                    <div key={index} className={`w-full py-5 rounded-2xl text-2xl font-black transition-all ${isDone ? 'bg-neon-green/10 border border-neon-green/30 text-neon-green opacity-60' : 'bg-slate-800 text-gray-600 border border-slate-700'}`}>
                                        <div className="flex justify-between items-center px-8">
                                            <span className="text-sm font-normal opacity-70">Подход {index + 1}</span>
                                            <span className="text-4xl">{reps}</span>
                                            <i className={`fa-solid ${isDone ? 'fa-check' : 'fa-lock'} text-lg opacity-80`}></i>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const RestModal = () => {
                if (!isResting) return null;
                const radius = 70; 
                const circumference = 2 * Math.PI * radius; 
                const strokeDashoffset = circumference - (restTime / 90) * circumference;
                
                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-md px-4">
                        <div className="glass-panel p-8 rounded-3xl w-full max-w-sm text-center border border-neon-blue/30 shadow-neon-blue">
                            <h3 className="text-2xl font-bold text-white mb-6">Восстановление</h3>
                            <div className="relative w-48 h-48 flex items-center justify-center mb-8 mx-auto">
                                <svg className="transform -rotate-90 w-48 h-48 absolute">
                                    <circle cx="96" cy="96" r={radius} stroke="#1e293b" strokeWidth="10" fill="none" />
                                    <circle 
                                        cx="96" cy="96" r={radius} 
                                        stroke="#06b6d4" strokeWidth="10" fill="none" 
                                        strokeDasharray={circumference} 
                                        strokeDashoffset={strokeDashoffset} 
                                        className="timer-circle drop-shadow-[0_0_10px_rgba(6,182,212,0.8)]"
                                        strokeLinecap="round" 
                                    />
                                </svg>
                                <div className="absolute text-6xl font-black text-neon-blue neon-text-glow">{restTime}</div>
                            </div>
                            <button onClick={() => { setIsResting(false); setRestTime(0); playSound("click"); }} className="w-full py-4 rounded-xl text-gray-400 border border-slate-700 active:bg-slate-800 transition-colors">
                                Пропустить отдых
                            </button>
                        </div>
                    </div>
                );
            };

            if (!isReady) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-dark-bg text-neon-blue">
                    <i className="fa-solid fa-circle-notch fa-spin text-5xl mb-4 drop-shadow-[0_0_15px_rgba(6,182,212,0.8)]"></i>
                    <span className="tracking-widest text-sm text-gray-400 font-bold">ЗАГРУЗКА...</span>
                </div>
            );

            return (
                <div className="min-h-screen bg-dark-bg safe-area-pt relative selection:bg-neon-blue/30">
                    <div className="max-w-md mx-auto px-4 h-full relative">
                        <header className="flex justify-between items-center py-5">
                            <h1 className="text-2xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-neon-blue to-neon-purple drop-shadow-[0_0_5px_rgba(6,182,212,0.3)]">
                                PUSHUP<span className="text-white">OS</span>
                            </h1>
                            <button 
                                onClick={() => { setSoundEnabled(!soundEnabled); if(!soundEnabled) playSound('click'); }} 
                                className={`w-10 h-10 rounded-full flex items-center justify-center border transition-all ${soundEnabled ? 'bg-neon-blue/10 border-neon-blue/50 text-neon-blue shadow-[0_0_10px_rgba(6,182,212,0.3)]' : 'bg-slate-800 border-slate-700 text-gray-500'}`}>
                                <i className={`fa-solid ${soundEnabled ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                            </button>
                        </header>
                        <main>
                            {activeTab === "dashboard" && <Dashboard />}
                            {activeTab === "warmup" && <Warmup />}
                            {activeTab === "workout" && <Workout />}
                        </main>
                    </div>
                    
                    <RestModal />
                    
                    {/* Строго 3 вкладки без кнопки ИИ/Звезды */}
                    <nav className="fixed bottom-0 w-full max-w-md left-1/2 transform -translate-x-1/2 nav-panel safe-area-pb z-40 pb-2 pt-2 rounded-t-2xl">
                        <div className="flex justify-around items-center px-2">
                            <button onClick={() => { setActiveTab("dashboard"); playSound("click"); }} className={`flex flex-col items-center p-2 w-24 transition-colors ${activeTab === 'dashboard' ? 'text-neon-blue drop-shadow-[0_0_8px_rgba(6,182,212,0.8)]' : 'text-gray-500 hover:text-gray-400'}`}>
                                <i className="fa-solid fa-chart-simple text-2xl mb-1"></i>
                                <span className="text-[10px] font-bold tracking-wider">БАЗА</span>
                            </button>
                            
                            <button onClick={() => { setActiveTab("warmup"); playSound("click"); }} className={`flex flex-col items-center p-2 w-24 transition-colors ${activeTab === 'warmup' ? 'text-neon-purple drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]' : 'text-gray-500 hover:text-gray-400'}`}>
                                <i className="fa-solid fa-fire text-2xl mb-1"></i>
                                <span className="text-[10px] font-bold tracking-wider">РАЗМИНКА</span>
                            </button>
                            
                            <button onClick={() => { setActiveTab("workout"); playSound("click"); }} className={`flex flex-col items-center p-2 w-24 transition-colors ${activeTab === 'workout' ? 'text-neon-green drop-shadow-[0_0_8px_rgba(16,185,129,0.8)]' : 'text-gray-500 hover:text-gray-400'}`}>
                                <i className="fa-solid fa-dumbbell text-2xl mb-1"></i>
                                <span className="text-[10px] font-bold tracking-wider">ТРЕНИРОВКА</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
